:root{color-scheme:dark;--ink:#f3f1ff;--muted:#c0b9d6;--line:#433651;--accent:#d6baff;--panel:#201b2d;--bg:#14101e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0,#302145,transparent 52%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px 18px 60px}header p{margin:0;color:#e2c5ff}h1{font-size:clamp(30px,5vw,50px);letter-spacing:-.045em;margin:2px 0 20px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:14px}.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--panel);min-width:0}.side{display:grid;align-content:start;gap:14px}h2{font-size:20px;margin:0 0 12px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:15px}.pill{padding:5px 12px;border:1px solid #735b8d;color:var(--accent);border-radius:50px}.clock{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums}button{font:inherit;color:var(--ink);background:#322740;border:1px solid #69547e;border-radius:10px;padding:10px 13px;cursor:pointer}button:hover:not(:disabled){background:#493457}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#75528f;border-color:#a17bbe}.primary:hover{background:#895ca9}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.board{width:min(100%,540px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #b79bd1;border-radius:5px;overflow:hidden;background:#1a1425}.cell{position:relative;min-width:0;aspect-ratio:1;padding:0;border:0;border-right:1px solid #544665;border-bottom:1px solid #544665;border-radius:0;background:#241c31;font-size:clamp(17px,3vw,29px);font-weight:650;color:#d9bbff;display:flex;align-items:center;justify-content:center}.cell.box-r{border-right:3px solid #a98cc5}.cell.box-b{border-bottom:3px solid #a98cc5}.cell.given{color:#f5ecff;background:#2d253b}.cell.peer{background:#3a304e}.cell.same </style><style>

.levelbar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.levelbar button{flex:1;min-width:76px}.levelbar button.active{background:#75528f;border-color:#d5b0f7;font-weight:750}.levelhint{font-size:12px;color:#c0b9d6;margin:-3px 0 12px}</style></head><body><main><header><p>삐약 · 테일즈위버</p><h1>스도쿠 <span class="muted" style="font-size:.5em"><span id="levelTitle">중급</span> · 9×9</span></h1></header><div class="bb-sound" role="group" aria-label="게임 효과음 설정"><button id="bbSoundToggle" type="button" aria-pressed="true">🔊 효과음 켜짐</button><label for="bbSoundVolume">음량 <input id="bbSoundVolume" type="range" min="0" max="100" value="45" step="5"><span class="bb-vol-text" id="bbSoundVolumeText">45%</span></label></div><div aria-label="난이도 선택" class="levelbar" role="group"><button data-level="easy" type="button">초급</button><button class="active" data-level="medium" type="button">중급</button><button data-level="hard" type="button">고급</button></div><div class="layout"><section class="card"><div class="toolbar"><span class="pill" id="levelPill">중급</span><span class="muted">플레이 시간</span><span class="clock" id="clock">00:00</span><button class="primary" id="new" style="margin-left:auto">새 게임</button></div><div aria-label="스도쿠 9행 9열" class="board" id="board" role="grid"></div><div aria-label="숫자 입력" class="numbar" id="numbar"></div><div class="actions"><button id="erase">지우기</button><button id="notes">메모: 끔</button><button id="undo">되돌리기</button><button class="primary" id="check">정답 확인</button></div><p aria-live="polite" id="status"></p></section><div class="side"><section class="card"><h2>플레이어</h2><label>닉네임<input autocomplete="off" id="scoreNick" maxlength="16" placeholder="닉네임 (필수)" required=""/></label><p class="msg" id="scoreStatus" role="status">게임 시작 전에 닉네임을 입력해 주세요.</p></section><section class="card"><div class="between"><h2>🏆 최고 점수 TOP 5</h2><button class="button-small" id="scoreRefresh" type="button">새로고침</button></div><ol aria-label="클럽 최고 기록 TOP 5" class="ranking" id="leaderboard"><li>서버 기록 불러오는 중...</li></ol><p class="tiny" style="margin-bottom:0">게임 종료 시 점수를 저장합니다.</p></section></div></div><footer>삐약 클럽</footer></main><script>
/* 미리듣기 샘플과 동일한 Web Audio 효과음 · 별도 음원 불필요 */
(()=>{'use strict';let ctx,master,enabled=true,volume=45,lastShoot=0;
try{const a=JSON.parse(localStorage.getItem('bbiyak_sfx')||'{}');enabled=a.enabled!==false;volume=Number.isFinite(+a.volume)?Math.max(0,Math.min(100,+a.volume)):45;}catch{}
const toggle=document.getElementById('bbSoundToggle'),slider=document.getElementById('bbSoundVolume'),label=document.getElementById('bbSoundVolumeText');
function update(){toggle.textContent=enabled?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';toggle.setAttribute('aria-pressed',String(enabled));slider.value=volume;label.textContent=volume+'%';if(master&&ctx)master.gain.setTargetAtTime(enabled?(volume/100)*.65:0,ctx.currentTime,.015);}
function save(){try{localStorage.setItem('bbiyak_sfx',JSON.stringify({enabled,volume}));}catch{}update();}
toggle.addEventListener('click',()=>{enabled=!enabled;save();if(enabled)play('digit');});slider.addEventListener('input',()=>{volume=Number(slider.value);save();});
function context(){if(!enabled||volume===0)return null;if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC;master=ctx.createGain();master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume().catch(()=>{});master.gain.setTargetAtTime(volume/100*.65,ctx.currentTime,.015);return ctx.currentTime+.02;}
function env(g,t,a,d,att=.005){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,a),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function tone(t,f,d,o={}){const c=ctx,s=c.createOscillator(),g=c.createGain(),fil=c.createBiquadFilter();s.type=o.type||'sine';s.frequency.setValueAtTime(Math.max(1,f),t);if(o.end)s.frequency.exponentialRampToValueAtTime(Math.max(1,o.end),t+d);fil.type='lowpass';fil.frequency.value=o.cutoff||11000;s.connect(fil);fil.connect(g);g.connect(master);env(g,t,o.vol??.20,d,o.attack??.005);s.start(t);s.stop(t+d+.02)}
function noise(t,d,o={}){const c=ctx,len=Math.ceil(c.sampleRate*(d+.02)),buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const white=Math.random()*2-1;last=(last+.065*white)/1.065;a[i]=o.smooth?last*5:white}const s=c.createBufferSource(),fil=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;fil.type=o.hp?'highpass':'lowpass';fil.frequency.value=o.freq||2200;fil.Q.value=o.q||.6;s.connect(fil);fil.connect(g);g.connect(master);env(g,t,o.vol??.23,d,o.attack??.003);s.start(t);s.stop(t+d+.02)}
function wood(t,{low=175,high=900,loud=.22}={}){noise(t,.056,{freq:high,vol:loud});tone(t,low,.077,{type:'triangle',vol:loud*.7,end:low*.52});tone(t,low*1.9,.035,{type:'sine',vol:loud*.25,end:low});}
function melody(t,notes,step=.115,vol=.17){notes.forEach(([f,k=1],i)=>tone(t+i*step,f,step*k,{type:'sine',vol}))}
const recipes={
shoot:t=>{tone(t,1250,.115,{end:360,type:'sawtooth',vol:.12});tone(t,690,.07,{end:240,type:'square',vol:.065})},
hit:t=>{tone(t,740,.10,{end:130,type:'square',vol:.13});noise(t,.085,{freq:3200,vol:.12})},
hurt:t=>{tone(t,190,.28,{end:55,type:'sawtooth',vol:.15});noise(t,.20,{freq:1100,vol:.13})},
boom:t=>{noise(t,.44,{freq:1000,vol:.33,smooth:true});tone(t,100,.37,{end:35,type:'sawtooth',vol:.19})},
stage:t=>melody(t,[[523],[659],[784],[1047,2]],.115,.16),
open:t=>{wood(t,{low:360,high:2500,loud:.13})},flag:t=>{tone(t,690,.08,{end:970,type:'sine',vol:.13})},unflag:t=>{tone(t,780,.08,{end:450,type:'sine',vol:.12})},
mine:t=>{noise(t,.40,{freq:660,vol:.29,smooth:true});tone(t,130,.35,{end:37,type:'triangle',vol:.23})},clear:t=>melody(t,[[523],[659],[784],[1047],[1318,2]],.12,.13),
digit:t=>{tone(t,615,.07,{end:475,type:'sine',vol:.095});noise(t,.018,{freq:1900,vol:.045})},erase:t=>{tone(t,470,.085,{end:270,type:'sine',vol:.095})},wrong:t=>{tone(t,280,.15,{type:'triangle',vol:.12});tone(t+.16,220,.18,{type:'triangle',vol:.12})},puzzle:t=>melody(t,[[523],[659],[784],[1047,1.5]],.135,.15),
stone:t=>wood(t,{low:220,high:1700,loud:.26}),stone2:t=>{wood(t,{low:150,high:1100,loud:.3});noise(t+.024,.06,{freq:800,vol:.065})},win:t=>melody(t,[[523],[659],[784],[1047]],.12,.16),lose:t=>melody(t,[[392],[330],[262]],.16,.12),
chessMove:t=>wood(t,{low:245,high:2000,loud:.17}),capture:t=>{wood(t,{low:240,high:2000,loud:.17});wood(t+.09,{low:160,high:1250,loud:.27})},check:t=>{tone(t,640,.11,{vol:.17});tone(t+.12,830,.22,{vol:.16})},mate:t=>{melody(t,[[440],[659],[880,2]],.18,.17)},
janggiMove:t=>{wood(t,{low:138,high:1300,loud:.3})},janggiCapture:t=>{wood(t,{low:220,high:1900,loud:.25});wood(t+.075,{low:118,high:800,loud:.28})},general:t=>{tone(t,605,.14,{type:'triangle',vol:.16});tone(t+.16,820,.23,{type:'triangle',vol:.18})},janggiWin:t=>melody(t,[[440],[554],[659],[880,2]],.145,.14)
};

function play(key){if(key==='shoot'){let now=performance.now();if(now-lastShoot<125)return;lastShoot=now;}try{const t=context();if(t!==null&&typeof recipes[key]==='function')recipes[key](t);}catch(e){/* 음향 지원 불가 시 게임 진행 유지 */}}
window.BbiyakSound={play};update();
})();
</script>
<script>
(()=>{'use strict';let level='medium';const scoreGame=()=> 'sudoku_'+level;let scoreTicketPromise=null;let roundName='';
const $score=id=>document.getElementById(id);
const GAME_SERVER_URL='https://decisive-del-91primula-916f7c42.apps.mistral.run';

function requireNick(){const input=$score('scoreNick');const nick=input.value.trim().slice(0,16);if(nick)return true;scoreMsg('닉네임을 입력해야 게임을 시작할 수 있습니다.');input.focus();return false;}
function scoreBase(){return GAME_SERVER_URL;}
function scoreMsg(t){$score('scoreStatus').textContent=t;}
async function scoreFetch(path,body){let base=scoreBase();if(!/^https?:\/\//i.test(base))throw Error('https://로 시작하는 서버 주소를 입력하세요.');
const res=await fetch(base+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
const data=await res.json();if(!res.ok)throw Error(data.error||'서버 요청에 실패했습니다.');return data;}
function beginScore(){if(scoreTicketPromise)return;roundName=$score('scoreNick').value.trim().slice(0,16);const base=scoreBase();if(!base)return;scoreTicketPromise=scoreFetch('/api/start',{game:scoreGame()}).then(x=>x.ticket).catch(e=>{scoreMsg('서버 기록 시작 실패: '+e.message);return null;});}
function resetScore(){scoreTicketPromise=null;roundName='';}
async function loadRanking(){const list=$score('leaderboard');try{const d=await scoreFetch('/api/leaderboard?game='+encodeURIComponent(scoreGame()));list.replaceChildren();for(let i=0;i<5;i++){const item=d.ranking?.[i],li=document.createElement('li'),position=document.createElement('span'),name=document.createElement('strong'),time=document.createElement('b');position.textContent=String(i+1);name.textContent=item?.name||'—';time.textContent=item?fmt(item.seconds):'—';li.append(position,name,time);list.append(li);}/* 정상 조회 시 닉네임 입력 안내는 지우지 않습니다. */}catch(e){list.textContent='랭킹을 불러오지 못했습니다.';scoreMsg('서버 연결 실패: '+e.message);}}
async function submitScore(){const nick=roundName;if(!scoreTicketPromise){scoreMsg('서버 기록 미등록: 플레이 시작 전에 서버 연결이 필요합니다.');return;}
if(!nick){scoreMsg('완료했습니다! 서버 기록을 저장하려면 닉네임이 필요합니다.');return;}
try{const ticket=await scoreTicketPromise;if(!ticket)return;const x=await scoreFetch('/api/record',{game:scoreGame(),ticket,name:nick});scoreMsg(x.newBest?'GitHub 최고 기록 저장 완료 · '+fmt(x.seconds):'기존 최고 기록 유지 · '+fmt(x.seconds));await loadRanking();}
catch(e){scoreMsg('기록 등록 실패: '+e.message);}}
$score('scoreRefresh').onclick=loadRanking;

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숙제 모집 · 삐약 클럽</title>
<style>
  :root {
    color-scheme: dark;
    font: 16px/1.55 system-ui, sans-serif;
    color: #f5f0ff;
    background: #14101e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 85% 0, #302143, transparent 62%);
  }

  main {
    max-width: 1120px;
    margin: auto;
    padding: 32px 20px 48px;
  }

  @media (max-width: 680px) {
    main { padding: 24px 12px 48px; }
  }

  a { color: #e3d8f4; text-underline-offset: 4px; }
  h1, h2, h3, p { margin: 0; }
  h2 { font-size: 1.25rem; }

  .party-heading {
    color: #f8efff;
    font: 16px/1.5 system-ui, sans-serif;
  }

  .party-heading-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 12px;
  }

  .party-heading p {
    margin: 0;
    color: #e2c5ff;
  }

  .party-heading h1 {
    margin: 5px 0 22px;
    font-size: clamp(29px, 5vw, 52px);
    letter-spacing: -.05em;
  }

  h3, .departure {
    color: inherit;
    font-size: 1.12rem;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .card-heading, .group, .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 14px;
  }

  .hint, .status { color: #cfc3df; font-size: .875rem; }
  .hint { margin-top: 8px; }
  #notice:empty, #ranking-status:empty { display: none; }
  #notice, #edit-error { color: #f6d891; }

  #parties {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 14px;
    margin-top: 14px;
  }

  #parties > .empty { grid-column: 1 / -1; }

  @media (max-width: 580px) {
    #parties { grid-template-columns: minmax(0, 1fr); }
  }

  .panel, dialog, .empty {
    border: 1px solid #544060;
    border-radius: 14px;
    background: #21192f;
  }

  .panel { overflow: hidden; }
  .panel.departed { filter: brightness(.25); }
  .card-heading { padding: 14px 16px; align-content: start; gap: 2px; }
  .departure { width: 100%; }
  .group { background: #302143; padding: 10px 16px; }
  .seat-actions { display: flex; flex-wrap: wrap; gap: 3px; }

  .shared-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 8px;
    margin-top: 10px;
  }

  .group-actions { display: flex; gap: 5px; }
  .group-info { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; }
  .count, .eta { color: #f6d891; font-variant-numeric: tabular-nums; }
  .status { border: 1px solid #6d5784; border-radius: 8px; padding: 2px 8px; }

  .status.full {
    background: #d6baff;
    border-color: #d6baff;
    color: #231731;
    font-weight: 700;
  }

  button, input, select {
    font: inherit;
    color: inherit;
    border: 1px solid #5b486e;
    border-radius: 8px;
  }

  button {
    background: #2a203b;
    padding: 8px 12px;
    cursor: pointer;
    font-weight: 650;
  }

  button:hover { background: #403052; }
  button.primary { background: #d6baff; border-color: #d6baff; color: #231731; }
  button.primary:hover { background: #e3cfff; }
  button.remove { padding: 4px 8px; font-size: .875rem; }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid #f6d891; outline-offset: 2px; }
  input, select { background: #191325; padding: 7px 8px; width: 100%; min-width: 0; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; }
  th, td { padding: 6px 4px; overflow-wrap: anywhere; }
  th { color: #e3d8f4; background: #2a203b; font-size: .875rem; }
  th:first-child { width: 46%; }
  th:nth-child(3) { width: 15%; }
  th:last-child { width: 83px; }
  td { border-top: 1px solid #3f304e; }

  .nickname-field { display: flex; gap: 5px; align-items: center; }
  .nickname-field input { padding-inline: 4px; }
  .nickname-field button { flex: none; }
  .nickname-field button, td button.remove { padding-inline: 4px; white-space: nowrap; }

  #member-list { min-height: 120px; }
  .empty { padding: 22px 16px; text-align: center; color: #cfc3df; }
  dialog { width: min(420px, calc(100% - 28px)); padding: 20px; color: inherit; }
  dialog::backdrop { background: #100b19bd; }
  form, label { display: grid; gap: 6px; }
  form { gap: 14px; }
  .actions { justify-content: flex-end; }
  #summary { white-space: pre-line; padding: 12px; border-radius: 8px; background: #302143; }
</style>
</head>
<body>
<main>
  <header class="party-heading">
    <div class="party-heading-top">
      <p>삐약 · 테일즈위버</p>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLScANX8oDu7O9AABsu7Rbxs8U1ifPwDKarE6hwYD6i37621BRw/viewform"
       target="_blank" rel="noopener">클럽원등록 ↗</a>
    </div>
    <h1 id="recruit-title">숙제 모집</h1>
  </header>

  <section aria-labelledby="recruit-title">
    <div class="shared-controls">
      <button class="primary" id="open-form" type="button">숙제 추가</button>
      <button id="reload-parties" type="button">모집 새로고침</button>
    </div>
    <p class="hint" id="ranking-status" role="status">에타 랭킹을 불러오는 중…</p>
    <p class="hint" id="notice" role="status"></p>
    <div id="parties"></div>
  </section>
</main>

<dialog id="party-dialog" aria-labelledby="dialog-title">
  <form id="party-form">
    <h2 id="dialog-title">숙제 모집 내용</h2>
    <div id="details">
      <label>
        콘텐츠명
        <select name="content" required>
          <option value="">선택</option>
          <option selected>신어헬</option>
          <option>신어헬오방</option>
          <option>신어헬오방아어</option>
          <option>오방</option>
          <option>아페(어렴)</option>
        </select>
      </label>
      <label>
        모집인원
        <select name="capacity" required>
          <option value="">선택</option>
          <option value="4">4명</option>
          <option value="6" selected>6명</option>
          <option value="8">8명</option>
          <option value="16">16명</option>
        </select>
      </label>
      <label>
        출발 일시
        <input type="datetime-local" name="departure" required>
      </label>
    </div>
    <p id="edit-error" role="alert" hidden></p>
    <p id="summary" hidden></p>
    <div class="actions">
      <button id="cancel-form" type="button">취소</button>
      <button id="previous" type="button" hidden>이전</button>
      <button id="next" class="primary" type="submit">내용 확인</button>
    </div>
  </form>
</dialog>

<dialog id="member-dialog" aria-labelledby="member-title">
  <form id="member-form">
    <h2 id="member-title">닉네임 선택(가나다순)</h2>
    <label>
      클럽원 목록
      <select id="member-list" size="7" required></select>
    </label>
    <div class="actions">
      <button id="member-close" type="button">닫기</button>
      <button class="primary" type="submit">선택</button>
    </div>
  </form>
</dialog>

<template id="party-card">
  <article class="panel">
    <div class="card-heading">
      <h3></h3>
      <span class="departure">
        출발 <time></time> <span class="ended" hidden>(종료)</span>
      </span>
    </div>
    <div class="group">
      <div class="group-info">
        <strong class="group-name"></strong>
        <span class="count" aria-live="polite"></span>
        <span class="status" aria-live="polite"></span>
      </div>
      <div class="group-actions">
        <button class="edit remove" type="button">편집</button>
        <button class="delete remove" type="button">삭제</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th scope="col">닉네임</th>
          <th scope="col">캐릭터</th>
          <th scope="col">에타</th>
          <th scope="col">참가</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </article>
</template>

<script>
const $ = id => document.getElementById(id);
const rankingUrl = 'https://raw.githubusercontent.com/91primula/tw-eta-data/main/eta_ranking.json';
const partyApiUrl = 'https://stable-jaime-91primula-ba73a0ee.apps.mistral.run/parties';
const collection = $('parties');
const dialog = $('party-dialog');
const form = $('party-form');
const notice = $('notice');
const editError = $('edit-error');
const members = new Map();
const memberDialog = $('member-dialog');
const memberList = $('member-list');

const koreaClock = new Intl.DateTimeFormat('sv-SE', {
  timeZone: 'Asia/Seoul',
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
  hour: '2-digit',
  minute: '2-digit',
  hourCycle: 'h23'
});

const normalize = name => String(name ?? '').trim().normalize('NFC').toLowerCase();
const partyVisibilityDuration = 7 * 24 * 60 * 60 * 1000;

let activeNickname = null;
let parties = [];
let busy = false;
let loaded = false;
let draft = null;
let editingIndex = null;

async function requestParties(change) {
  if (busy) return false;

  const error = dialog.open ? editError : notice;
  busy = true;
  $('reload-parties').disabled = true;
  $('next').disabled = true;
  notice.textContent = change ? '저장 중…' : '모집을 불러오는 중…';
  if (dialog.open) editError.hidden = true;

  try {
    if (partyApiUrl.includes('YOUR-SERVICE')) {
      throw new Error('모집 API 주소를 설정해 주세요.');
    }

    const options = change ? {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(change)
    } : {};

    const response = await fetch(partyApiUrl, {
      ...options,
      signal: AbortSignal.timeout(change ? 90000 : 15000)
    });
    if (change && (response.status === 401 || response.status === 403)) {
      throw new Error('모집 서버가 코드 없는 변경 요청을 거부했습니다.');
    }

    const data = await response.json();

    if (!response.ok || !Array.isArray(data.parties)) {
      throw new Error(data.error || '모집을 불러올 수 없습니다.');
    }

    parties = data.parties;
    loaded = true;
    render();
    notice.textContent = change ? '저장했습니다.' : '';
    return true;
  } catch (failure) {
    notice.textContent = '';
    error.textContent = failure instanceof TypeError || failure.name === 'TimeoutError'
      ? '서버에 연결할 수 없습니다. 모집 새로고침으로 반영 여부를 확인해 주세요.'
      : failure.message;
    error.hidden = false;
    return false;
  } finally {
    busy = false;
    $('reload-parties').disabled = false;
    $('open-form').disabled = !loaded;
    $('next').disabled = false;
  }
}

$('reload-parties').addEventListener('click', () => requestParties());

function displayTime(value) {
  const [date, time] = value.split('T');
  const [, month, day] = date.split('-');
  return `${Number(month)}월 ${Number(day)}일 ${time}`;
}

function fillMember(row, name) {
  const member = members.get(normalize(name));
  row.cells[1].textContent = member?.Character || '-';

  const level = String(member?.Level ?? '').trim();
  row.cells[2].textContent = level !== '' && Number.isFinite(Number(level))
    ? Number(level)
    : '-';
}

function updateCount(card, party) {
  const filled = party.names.filter(name => name.trim()).length;
  card.querySelector('.count').textContent = `${filled} / ${party.names.length}명`;

  const status = card.querySelector('.status');
  const description = filled === party.names.length ? '모집완료' : '모집중';
  if (status.textContent !== description) status.textContent = description;
  status.classList.toggle('full', filled === party.names.length);
}

function updatePartyVisibility(now = Date.now()) {
  let hasVisibleParty = false;

  for (const card of collection.querySelectorAll('.panel')) {
    const age = now - Date.parse(card.querySelector('time').dateTime);
    const hasDeparted = age >= 0;

    card.classList.toggle('departed', hasDeparted);
    card.querySelector('.ended').hidden = !hasDeparted;
    card.hidden = age >= partyVisibilityDuration;

    if (!card.hidden) hasVisibleParty = true;
  }

  const empty = collection.querySelector('.empty');
  if (empty) empty.hidden = hasVisibleParty;
}

function render() {
  collection.replaceChildren();

  const sortedParties = parties.map((party, index) => ({ party, index }));
  sortedParties.sort((a, b) => b.party.departure.localeCompare(a.party.departure));

  sortedParties.forEach(({ party, index }) => {
    const card = $('party-card').content.firstElementChild.cloneNode(true);
    card.dataset.partyIndex = index;
    card.querySelector('h3').textContent = party.content;

    const departure = card.querySelector('time');
    departure.dateTime = party.departure + '+09:00';
    departure.textContent = displayTime(party.departure);

    card.querySelector('.group-name').textContent = `${index + 1}번 그룹`;
    const tbody = card.querySelector('tbody');

    party.names.forEach((name, seat) => {
      const row = tbody.insertRow();

      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 40;
      input.setAttribute('aria-label', `${index + 1}번 그룹 ${seat + 1}번 자리 닉네임`);
      input.placeholder = '닉네임 입력';
      input.value = name;

      const field = document.createElement('div');
      field.className = 'nickname-field';

      const choose = document.createElement('button');
      choose.type = 'button';
      choose.className = 'remove';
      choose.textContent = '목록';
      choose.setAttribute('aria-label', `${seat + 1}번 자리 닉네임 목록`);
      choose.disabled = !members.size;
      choose.dataset.memberPicker = '';

      choose.addEventListener('click', () => {
        activeNickname = input;
        memberDialog.showModal();
        memberList.focus();
        memberList.value = members.get(normalize(input.value))?.UserId ?? '';
      });

      field.append(input, choose);
      row.insertCell().append(field);
      row.insertCell();
      row.insertCell().className = 'eta';

      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'remove';
      cancel.textContent = '취소';
      cancel.setAttribute('aria-label', `${seat + 1}번 자리 참가 취소`);
      cancel.disabled = !name.trim();

      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'remove';
      save.textContent = '저장';
      save.setAttribute('aria-label', `${seat + 1}번 자리 닉네임 저장`);
      save.disabled = true;

      const actions = document.createElement('div');
      actions.className = 'seat-actions';
      actions.append(save, cancel);
      row.insertCell().append(actions);

      const changeSeat = name => requestParties({
        action: 'seat',
        id: party.id,
        version: party.version,
        seat,
        name
      });

      save.addEventListener('click', () => changeSeat(input.value.trim()));
      cancel.addEventListener('click', () => changeSeat(''));

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !save.disabled) save.click();
      });

      input.addEventListener('input', () => {
        const nextName = input.value.trim();
        save.disabled = !nextName || nextName === name;
        fillMember(row, nextName);
      });

      fillMember(row, name);
    });

    updateCount(card, party);

    const edit = card.querySelector('.edit');
    edit.setAttribute('aria-label', `${index + 1}번 그룹 편집`);
    edit.addEventListener('click', () => openPartyForm(index));

    const remove = card.querySelector('.delete');
    remove.setAttribute('aria-label', `${index + 1}번 그룹 삭제`);
    remove.addEventListener('click', () => {
      if (!confirm(`${index + 1}번 그룹 (${party.content}) 모집을 삭제할까요?`)) return;
      requestParties({ action: 'delete', id: party.id, version: party.version });
    });

    collection.append(card);
  });

  const empty = document.createElement('p');
  empty.className = 'empty';
  empty.textContent = '표시할 숙제 모집이 없습니다.';
  collection.append(empty);

  updatePartyVisibility();
}

function showDetails() {
  draft = null;
  $('details').hidden = false;
  editError.hidden = true;
  $('summary').hidden = true;
  $('previous').hidden = true;
  $('next').textContent = '내용 확인';
}

function openPartyForm(index = null) {
  if (busy) return;

  editingIndex = index;
  const party = parties[index];
  form.reset();

  $('dialog-title').textContent = party ? `${index + 1}번 그룹 편집` : '숙제 모집 내용';

  if (party) {
    form.elements.content.value = party.content;
    form.elements.capacity.value = String(party.names.length);
  }

  form.elements.departure.value = party?.departure
    ?? koreaClock.format(new Date()).replace(' ', 'T');

  showDetails();
  dialog.showModal();
  form.elements.content.focus();
}

$('open-form').addEventListener('click', () => openPartyForm());
form.addEventListener('input', () => { editError.hidden = true; });
$('cancel-form').addEventListener('click', () => { if (!busy) dialog.close(); });
dialog.addEventListener('cancel', event => { if (busy) event.preventDefault(); });

$('previous').addEventListener('click', () => {
  if (busy) return;
  showDetails();
  form.elements.content.focus();
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (busy) return;

  if (draft) {
    if (await requestParties(draft)) {
      dialog.close();
      const edit = collection.querySelector(`[data-party-index="${editingIndex}"]:not([hidden]) .edit`);
      (edit ?? $('open-form')).focus();
    }
    return;
  }

  const fields = new FormData(form);
  const content = fields.get('content');
  const capacity = Number(fields.get('capacity'));
  const departure = fields.get('departure');
  const party = parties[editingIndex];
  const participants = (party?.names ?? []).filter(name => name.trim());

  if (capacity < participants.length) {
    editError.textContent = `현재 참가자가 ${participants.length}명입니다. 모집인원을 ${participants.length}명 이상으로 선택해 주세요.`;
    editError.hidden = false;
    form.elements.capacity.focus();
    return;
  }

  draft = party
    ? { action: 'edit', id: party.id, version: party.version, content, departure, capacity }
    : { action: 'add', requestId: crypto.randomUUID(), content, departure, capacity };

  $('summary').textContent = `콘텐츠명  ${content}\n모집인원  ${capacity}명\n출발  ${displayTime(departure)}`;
  $('details').hidden = true;
  $('summary').hidden = false;
  $('previous').hidden = false;
  $('next').textContent = editingIndex === null ? '모집 추가' : '변경 저장';
  $('next').focus();
});

$('member-close').addEventListener('click', () => memberDialog.close());

$('member-form').addEventListener('submit', event => {
  event.preventDefault();
  if (!activeNickname || !memberList.value) return;

  activeNickname.value = memberList.value;
  activeNickname.dispatchEvent(new Event('input'));
  memberDialog.close();
});

memberDialog.addEventListener('close', () => { activeNickname = null; });

async function loadRanking() {
  try {
    const response = await fetch(rankingUrl, {
      cache: 'no-store',
      signal: AbortSignal.timeout(15000)
    });

    if (!response.ok) throw new Error('랭킹 조회 실패');

    const data = await response.json();
    if (!Array.isArray(data?.Rankings)) throw new Error('랭킹 형식 오류');

    const unrankedMembers = Array.isArray(data.NotFound)
      ? data.NotFound
          .filter(nickname => typeof nickname === 'string')
          .map(nickname => ({ UserId: nickname.trim() }))
      : [];

    for (const member of [...data.Rankings, ...unrankedMembers]) {
      const name = normalize(member?.UserId);
      if (!name || members.has(name)) continue;

      members.set(name, member);
    }

    const collator = new Intl.Collator('ko');
    const sortedNames = [...members.keys()].sort(collator.compare);
    for (const name of sortedNames) {
      const member = members.get(name);
      const option = document.createElement('option');
      option.value = member.UserId;
      option.textContent = member.UserId;
      memberList.append(option);
    }

    for (const button of collection.querySelectorAll('[data-member-picker]')) {
      button.disabled = !members.size;
    }

    for (const row of collection.querySelectorAll('tbody tr')) {
      fillMember(row, row.querySelector('input').value);
    }

    $('ranking-status').textContent = members.size
      ? ''
      : '에타 랭킹에 등록된 닉네임이 없습니다. 직접 입력할 수 있습니다.';
  } catch {
    $('ranking-status').textContent = '에타 랭킹을 불러오지 못했습니다. 닉네임은 직접 입력할 수 있습니다.';
  }
}

const clubHome = $('club-home');

if (window.self !== window.top && clubHome) {
  clubHome.hidden = true;
}
$('open-form').disabled = true;

requestParties();
loadRanking();
setInterval(updatePartyVisibility, 15_000);
</script>
</body>
</html>

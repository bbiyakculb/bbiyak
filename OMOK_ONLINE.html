<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14101e"><title>온라인 오목 · 삐약</title><style>
:root{color-scheme:dark;--bg:#14101e;--panel:#201b2d;--panel2:#2a223b;--ink:#f3f1ff;--muted:#c0b9d6;--line:#433651;--accent:#d6baff;--gold:#e5cc91}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0,#302145,transparent 52%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1150px;margin:auto;padding:24px 18px 65px}header p{margin:0;color:#e2c5ff}h1{font-size:clamp(30px,5vw,50px);letter-spacing:-.045em;margin:2px 0 20px}h2{font-size:20px;margin:0 0 12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:14px}.side{display:grid;gap:14px;align-content:start}.toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:15px}label{font-size:13px;color:var(--muted);display:grid;gap:5px}input,button{font:inherit}input{background:#15111d;border:1px solid #57456b;border-radius:9px;padding:10px 11px;color:var(--ink);min-width:0}input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{border:1px solid #69547e;border-radius:10px;padding:10px 13px;color:var(--ink);background:#322740;cursor:pointer}button:hover:not(:disabled){background:#433255}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#75528f;color:#fff;border-color:#9d76bb}.primary:hover:not(:disabled){background:#875eaa}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{display:inline-block;border:1px solid #725b8d;border-radius:30px;padding:4px 12px;color:var(--accent)}.boxrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.boardwrap{width:min(100%,645px);margin:auto;touch-action:manipulation}.board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));width:100%;aspect-ratio:1;background:#e0bb77;border:9px ridge #9e7544;box-shadow:0 6px 18px #0006,inset 0 0 12px #80562855;border-radius:3px;overflow:hidden;padding:8px}.cell{min-width:0;aspect-ratio:1;border:0;border-radius:0;padding:0;background:transparent;position:relative;cursor:crosshair;touch-action:manipulation}.cell:hover:not(:disabled){background:#68492220}.cell::before{content:"";position:absolute;top:50%;left:0;width:100%;height:1px;background:#73522d;pointer-events:none}.cell::after{content:"";position:absolute;left:50%;top:0;height:100%;width:1px;background:#73522d;pointer-events:none}.cell.edge-l::before{left:50%;width:50%}.cell.edge-r::before{width:50%}.cell.edge-t::after{top:50%;height:50%}.cell.edge-b::after{height:50%}.cell:disabled{cursor:default;opacity:1}.stone{position:absolute;z-index:2;width:84%;height:84%;left:8%;top:8%;border-radius:50%;box-shadow:1px 2px 3px #0005}.stone.black{background:radial-gradient(circle at 35% 28%,#777,#191919 43%,#050505)}.stone.white{background:radial-gradient(circle at 30% 24%,#fff,#eee 45%,#aaa);border:1px solid #b6a88e}.stone.last::after{content:"";position:absolute;inset:39%;background:#e25f60;border-radius:50%}.star{position:absolute;z-index:1;width:16%;height:16%;border-radius:50%;background:#624122;top:42%;left:42%}.cell:disabled{cursor:default;opacity:1}.status{font-weight:700;font-size:17px}.players{display:grid;gap:10px}.player{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}.player.on{border-color:#b596d5;background:#352644}.disc{height:19px;width:19px;border-radius:50%;background:#111;border:1px solid #666}.disc.white{background:#eee;border-color:#ccc}.score{margin-left:auto;color:var(--gold);font-weight:bold}.joinline{display:flex;gap:8px;flex-wrap:wrap}.joinline input{flex:1;min-width:120px}#logs{height:150px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#17121f;padding:8px;overflow-wrap:anywhere}#logs div{padding:3px 0;font-size:13px}#msg{flex:1;min-width:110px}#toast{min-height:22px;color:var(--gold)}footer{margin-top:25px;border-top:1px solid var(--line);padding:15px 0;color:var(--muted);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.card{padding:15px}}@media(max-width:420px){.board{border-width:4px}.toolbar input{width:100%}}
</style></head><body><main><header><p>삐약 · 테일즈위버</p><h1>온라인 오목</h1></header>
<div class="toolbar card"><span class="muted">실시간 게임 서버</span><span id="connection" class="pill">자동 연결 중</span></div>
<div class="grid"><section class="card"><div class="boxrow" style="justify-content:space-between;margin-bottom:10px"><h2>오목판 · 15×15</h2><span id="roomLabel" class="pill">방에 입장하세요</span></div><div class="boardwrap"><div class="board" id="board" role="grid" aria-label="15 x 15 오목판"></div></div><p id="status" class="status" aria-live="polite">서버에 연결하고 방을 만들어 주세요.</p><p class="tiny muted">자유룰: 먼저 연속 5개 이상을 놓으면 승리합니다. 렌주 금수 규칙은 적용하지 않습니다.</p></section>
<div class="side"><section class="card"><h2>대국 입장</h2><label>닉네임<input id="nick" maxlength="16" placeholder="닉네임"></label><div class="boxrow" style="margin:11px 0"><button id="create" class="primary">새 방 만들기</button><button id="copy">초대 링크 복사</button></div><div class="joinline"><input id="roomInput" maxlength="6" placeholder="6자리 방 코드"><button id="join" class="primary">참가</button><button id="watch">관전</button></div><p class="tiny muted">초대 링크를 받은 상대는 자동으로 방 코드가 입력됩니다. 두 번째 참가자는 백돌이 됩니다.</p><div class="boxrow"><button id="leave">방 나가기</button><span id="role" class="tiny muted"></span></div></section>
<section class="card"><h2>대국 현황</h2><div id="players" class="players"></div><p id="roundInfo" class="muted">대국 1 · 관전자 0명</p><div class="boxrow"><button id="undo">무르기 요청</button><button id="rematch" class="primary">재대결 신청</button></div><div id="undoBox" hidden style="margin-top:12px"><p>상대가 무르기를 요청했습니다.</p><button id="acceptUndo" class="primary">승인</button> <button id="rejectUndo">거절</button></div><p id="toast" role="status"></p></section>
<section class="card"><h2>대국 채팅</h2><div id="logs" aria-live="polite"></div><form id="chat" class="joinline" style="margin-top:8px"><input id="msg" maxlength="120" placeholder="메시지 입력"><button type="submit">보내기</button></form></section></div></div>
<footer>삐약 클럽 · 실시간 오목 대전 · 대국 기록은 서버 메모리에만 유지되며 서버 재시작 시 초기화됩니다.</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cells=[],query=new URLSearchParams(location.search);let socket=null,state=null,role=null,ownToken=null,connected=false,reconnect=null,desiredRoom=query.get('room')?.toUpperCase()||'',intentional=false;
const GAME_SERVER_URL='https://decisive-del-91primula-916f7c42.apps.mistral.run';$('nick').value=localStorage.getItem('bbiyak_omok_nick')||'';$('roomInput').value=desiredRoom;
function toast(t){$('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',5000)}
function log(t){const div=document.createElement('div');div.textContent=t;$('logs').append(div);$('logs').scrollTop=$('logs').scrollHeight}
function send(o){if(!socket||socket.readyState!==WebSocket.OPEN){toast('먼저 서버에 연결해 주세요.');return false;}socket.send(JSON.stringify(o));return true}
function url(){const u=new URL(GAME_SERVER_URL);return (u.protocol==='https:'?'wss:':'ws:')+`//${u.host}`;}
function connect(){const endpoint=url();if(socket){intentional=true;socket.close();}intentional=false;const ws=new WebSocket(endpoint);socket=ws;$('connection').textContent='연결 중';ws.onopen=()=>{if(socket!==ws)return;connected=true;$('connection').textContent='연결됨';toast('서버에 연결되었습니다.');if(desiredRoom){send({type:'join',room:desiredRoom,name:name(),token:localStorage.getItem('bbiyak_omok_token_'+desiredRoom)||null});}};ws.onclose=()=>{if(socket!==ws)return;connected=false;$('connection').textContent='연결 끊김';if(!intentional){toast('연결이 끊어졌습니다. 서버를 확인해 주세요.');clearTimeout(reconnect);reconnect=setTimeout(connect,4000)}render()};ws.onerror=()=>{};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='error')toast(d.message);if(d.type==='notice')toast(d.message);if(d.type==='joined'){role=d.role;ownToken=d.token;if(ownToken)localStorage.setItem('bbiyak_omok_token_'+d.room,ownToken);desiredRoom=d.room;history.replaceState({},'',location.pathname+'?room='+d.room);$('roomInput').value=d.room;toast(role==='spectator'?'관전자로 입장했습니다.':role===1?'흑돌로 입장했습니다.':'백돌로 입장했습니다.')}if(d.type==='left'){state=null;role=null;desiredRoom='';history.replaceState({},'',location.pathname);render()}if(d.type==='state'){state=d;render()}if(d.type==='chat')log(`${d.name}: ${d.message}`)};}
function name(){const n=$('nick').value.trim().slice(0,16)||'플레이어';localStorage.setItem('bbiyak_omok_nick',n);return n}
function enter(spectator){const room=$('roomInput').value.toUpperCase().trim();if(!/^[A-Z2-9]{6}$/.test(room)){toast('방 코드 6자리를 입력해 주세요.');return;}desiredRoom=room;send({type:'join',room,name:name(),token:localStorage.getItem('bbiyak_omok_token_'+room)||null,spectator})}
function render(){const board=state?.board||Array(225).fill(0),last=state?.moves?.at(-1);for(let i=0;i<225;i++){const c=cells[i];c.replaceChildren();c.disabled=!connected||!state||typeof role!=='number'||state.turn!==role||!!state.winner||state.draw||!state.players[0]?.online||!state.players[1]?.online||!!board[i];if([48,52,56,108,112,116,168,172,176].includes(i)){const star=document.createElement('span');star.className='star';c.append(star);}if(board[i]){let disc=document.createElement('span');disc.className='stone '+(board[i]===1?'black':'white')+(last===i?' last':'');c.append(disc);}}
$('roomLabel').textContent=state?'방 '+state.room:'방에 입장하세요';$('role').textContent=role==='spectator'?'관전자':role===1?'흑돌 (1번 플레이어)':role===2?'백돌 (2번 플레이어)':'';
const ps=state?.players||[null,null];$('players').replaceChildren();ps.forEach((p,i)=>{const d=document.createElement('div');d.className='player'+(state?.turn===i+1&&!state?.winner&&!state?.draw?' on':'');const disc=document.createElement('span');disc.className='disc'+(i?' white':'');const text=document.createElement('span');text.textContent=(p?.name||'대기 중')+(p&&!p.online?' · 연결 끊김':'')+(role===i+1?' (나)':'');const sc=document.createElement('span');sc.className='score';sc.textContent=(state?.score?.[i]||0)+'승';d.append(disc,text,sc);$('players').append(d)});
$('roundInfo').textContent=`대국 ${state?.round||1} · 관전자 ${state?.spectators||0}명 · ${state?.moves?.length||0}수 진행`;
let s='서버에 연결하고 방을 만들어 주세요.';if(state){if(state.winner)s=(ps[state.winner-1]?.name||'플레이어')+' 승리!';else if(state.draw)s='무승부!';else if(!ps[0]||!ps[1])s='상대방 입장 대기 중';else if(!ps[0].online||!ps[1].online)s='상대방 재접속 대기 중';else s=(state.turn===1?'흑돌':'백돌')+' 차례'+(state.turn===role?' · 내 차례':'');}$('status').textContent=s;
$('undo').disabled=typeof role!=='number'||!state?.moves?.length||!!state?.winner||!!state?.draw;$('rematch').disabled=typeof role!=='number'||(!state?.winner&&!state?.draw);$('undoBox').hidden=!(typeof role==='number'&&state?.pendingUndo===3-role);}
for(let i=0;i<225;i++){const c=document.createElement('button');c.type='button';c.className='cell'+(i%15===0?' edge-l':'')+(i%15===14?' edge-r':'')+(i<15?' edge-t':'')+(i>=210?' edge-b':'');c.setAttribute('aria-label',`${Math.floor(i/15)+1}행 ${i%15+1}열`);c.addEventListener('click',()=>send({type:'place',index:i}));cells.push(c);$('board').append(c)}
$('create').onclick=()=>send({type:'create',name:name()});$('join').onclick=()=>enter(false);$('watch').onclick=()=>enter(true);$('leave').onclick=()=>{send({type:'leave'});desiredRoom='';history.replaceState({},'',location.pathname)};$('copy').onclick=async()=>{if(!state){toast('먼저 방을 만들어 주세요.');return;}const link=location.origin+location.pathname+'?room='+encodeURIComponent(state.room);try{await navigator.clipboard.writeText(link);toast('초대 링크를 복사했습니다.')}catch{prompt('초대 링크를 복사하세요',link)}};$('undo').onclick=()=>send({type:'undo_request'});$('acceptUndo').onclick=()=>send({type:'undo_answer',accept:true});$('rejectUndo').onclick=()=>send({type:'undo_answer',accept:false});$('rematch').onclick=()=>{if(send({type:'rematch'}))toast('상대방의 재대결 신청을 기다립니다.')};$('chat').onsubmit=e=>{e.preventDefault();const value=$('msg').value.trim();if(value&&send({type:'chat',message:value}))$('msg').value=''};render();connect();})();
</script></body></html>

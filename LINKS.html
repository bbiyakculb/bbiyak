<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>링크모음 · 삐약</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f1ff;
      --muted: #c0b9d6;
      --line: #383049;
      --accent: #d6baff;
      --panel: #201b2d;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 80% 0, #302145, transparent 50%), #14101e;
      color: var(--ink);
      font: 16px system-ui, sans-serif;
    }

    main { max-width: 1100px; margin: auto; padding: 0 24px 25px; }
    header { padding: 25px 24px; }
    header p { margin: 0; color: #e2c5ff; font: 16px/1.5 system-ui, sans-serif; }

    h1 {
      margin: 5px 0 22px;
      color: #f8efff;
      font-size: clamp(29px, 5vw, 52px);
      letter-spacing: -.05em;
      line-height: 1.5;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .tile { min-width: 0; overflow: hidden; }
    .tile:hover, .tile:focus-within { border-color: var(--accent); }
    .tile a { display: block; color: var(--ink); text-decoration: none; }

    .preview {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: linear-gradient(145deg, #35234d, #211a30);
      color: var(--muted);
      padding: 10px;
      overflow-wrap: anywhere;
    }

    .preview img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0;
    }

    .preview img.ready { opacity: 1; }
    .card-text { display: grid; gap: 5px; padding: 14px; overflow-wrap: anywhere; }
    .kind { color: var(--accent); font-size: .82rem; }
    .note { color: var(--muted); font-size: .85rem; }
    details { margin: 0 0 16px; padding: 18px; }
    summary { width: fit-content; cursor: pointer; font-weight: 650; }

    form {
      display: grid;
      grid-template-columns: 2fr 1fr;
      align-items: end;
      gap: 12px;
      margin: 16px 0;
    }

    label { display: grid; gap: 5px; color: var(--muted); font-size: .9rem; }

    input, button {
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #171222;
      color: var(--ink);
      font: inherit;
    }

    button { justify-self: start; cursor: pointer; color: var(--accent); }
    button:hover { border-color: var(--accent); }
    button:disabled { cursor: wait; opacity: .6; }

    .remove {
      margin: 0 14px 14px;
      padding: 5px 9px;
      border-color: rgba(192, 185, 214, .18);
      background: transparent;
      color: var(--muted);
      font-size: .85rem;
    }

    .remove:hover, .remove:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tile a:focus-visible { outline-offset: -3px; }

    @media (max-width: 720px) {
      main, header { padding-inline: 16px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      form { grid-template-columns: 1fr; }
    }

    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p>삐약 · 테일즈위버</p>
      <h1>링크모음</h1>
    </header>

    <details id="manager" class="panel" hidden>
      <summary>링크 관리</summary>
      <form id="link-form">
        <label>링크 주소
          <input name="url" type="url" placeholder="https://…" required>
        </label>
        <label>카드 제목 (선택)
          <input name="title" type="text" maxlength="100" placeholder="예: 신어헬 공략">
        </label>
        <label>미리보기 이미지 주소 (선택)
          <input name="image" type="url" placeholder="비워두면 자동 미리보기">
        </label>
        <button type="submit">링크 추가</button>
      </form>
      <button id="download" type="button">수정된 LINKS.html 다운로드</button>
      <p class="note" id="status" role="status">수정한 파일을 GitHub에 올려주세요.</p>
    </details>

    <p id="empty" class="note" hidden>등록된 링크가 없습니다.</p>
    <section id="link-grid" class="grid" aria-label="등록된 링크"></section>
  </main>

  <script id="link-data" type="application/json">
[
  {
    "title": "테일즈위버 공식 홈페이지",
    "url": "https://tales.nexon.com/"
  }
]
  </script>

  <script>
    const data = document.getElementById('link-data');
    const manager = document.getElementById('manager');
    const form = document.getElementById('link-form');
    const grid = document.getElementById('link-grid');
    const empty = document.getElementById('empty');
    const status = document.getElementById('status');
    const downloadButton = document.getElementById('download');
    const isLocal = location.protocol === 'file:';

    // 카드와 관리 화면을 표시하기 전의 HTML을 내보내기용으로 보관합니다.
    const original = isLocal ? document.documentElement.cloneNode(true) : null;
    let links = JSON.parse(data.textContent);
    let saving = false;

    function parseUrl(value) {
      if (!value) return null;

      try {
        const url = new URL(value);
        if (['https:', 'http:'].includes(url.protocol) && !url.username && !url.password) {
          return url;
        }
      } catch {
        return null;
      }

      return null;
    }

    function getYouTubeId(url) {
      const host = url.hostname;
      const [section, id] = url.pathname.split('/').filter(Boolean);
      let candidate;

      if (host === 'youtu.be') {
        candidate = section;
      } else if (host === 'youtube.com' || host.endsWith('.youtube.com')) {
        if (section === 'watch') candidate = url.searchParams.get('v');
        if (['shorts', 'live', 'embed'].includes(section)) candidate = id;
      }

      return /^[A-Za-z0-9_-]{11}$/.test(candidate ?? '') ? candidate : null;
    }

    function buildHtml(entries) {
      const copy = original.cloneNode(true);
      const json = JSON.stringify(entries, null, 2).replace(/</g, '\\u003c');
      copy.querySelector('#link-data').textContent = '\n' + json + '\n  ';
      return '<!doctype html>\n' + copy.outerHTML;
    }

    function downloadHtml(entries) {
      const file = new Blob([buildHtml(entries)], { type: 'text/html;charset=utf-8' });
      const fileUrl = URL.createObjectURL(file);

      const download = document.createElement('a');
      download.href = fileUrl;
      download.download = 'LINKS.html';
      document.body.append(download);
      download.click();
      download.remove();

      setTimeout(() => URL.revokeObjectURL(fileUrl), 1000);
    }

    function setSaving(value) {
      saving = value;
      manager.querySelectorAll('button').forEach(button => { button.disabled = value; });
      grid.querySelectorAll('.remove').forEach(button => { button.disabled = value; });
    }

    async function removeLink(index) {
      if (saving) return;

      const updatedLinks = links.filter((_, position) => position !== index);
      let message;

      setSaving(true);

      try {
        if (typeof window.showSaveFilePicker === 'function') {
          const file = await window.showSaveFilePicker({
            suggestedName: 'LINKS.html',
            types: [{
              description: 'HTML 파일',
              accept: { 'text/html': ['.html'] }
            }]
          });

          const writer = await file.createWritable();
          await writer.write(buildHtml(updatedLinks));
          await writer.close();
          message = '삭제 내용을 HTML 파일에 저장했습니다.';
        } else {
          downloadHtml(updatedLinks);
          message = '삭제된 목록이 담긴 LINKS.html을 다운로드했습니다.';
        }

        links = updatedLinks;
        render();
      } catch (error) {
        if (error.name === 'AbortError') {
          message = '저장을 취소했습니다. 링크는 그대로 남아 있습니다.';
        } else {
          message = '파일에 저장하지 못했습니다. 다시 시도해 주세요.';
        }
      } finally {
        setSaving(false);
        manager.open = true;
        status.textContent = message;
        manager.querySelector('summary').focus();
      }
    }

    function render() {
      grid.replaceChildren();

      links.forEach((entry, index) => {
        const url = parseUrl(entry.url);
        if (!url) return;

        const domain = url.hostname.replace(/^www\./, '');
        const videoId = getYouTubeId(url);
        const title = entry.title || (videoId ? 'YouTube 영상' : domain);

        const card = document.createElement('article');
        card.className = 'panel tile';

        const link = document.createElement('a');
        link.href = url.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';

        const preview = document.createElement('div');
        preview.className = 'preview';
        preview.textContent = domain;
        preview.setAttribute('aria-hidden', 'true');

        const image = document.createElement('img');
        image.alt = '';
        image.loading = 'lazy';
        image.referrerPolicy = 'no-referrer';
        image.addEventListener('load', () => image.classList.add('ready'));
        image.src = parseUrl(entry.image)?.href || (
          videoId
            ? 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg'
            : 'https://image.thum.io/get/width/480/noanimate/?url=' + encodeURIComponent(url.href)
        );
        preview.append(image);

        const caption = document.createElement('div');
        caption.className = 'card-text';

        const kind = document.createElement('span');
        kind.className = 'kind';
        kind.textContent = videoId ? 'YouTube' : '웹사이트';

        const heading = document.createElement('strong');
        heading.textContent = title;

        caption.append(kind, heading);
        link.append(preview, caption);
        card.append(link);

        if (isLocal) {
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'remove';
          remove.textContent = '삭제';
          remove.setAttribute('aria-label', title + ' 삭제');
          remove.addEventListener('click', () => removeLink(index));
          card.append(remove);
        }

        grid.append(card);
      });

      empty.hidden = grid.childElementCount > 0;
    }

    if (isLocal) {
      manager.hidden = false;

      form.addEventListener('submit', event => {
        event.preventDefault();
        if (saving) return;

        const fields = new FormData(form);
        const url = parseUrl(fields.get('url'));
        const imageValue = fields.get('image').trim();
        const image = parseUrl(imageValue);

        if (!url || (imageValue && !image)) {
          status.textContent = 'http:// 또는 https://로 시작하는 주소를 입력해 주세요.';
          return;
        }

        const entry = { title: fields.get('title').trim(), url: url.href };
        if (image) entry.image = image.href;

        links.push(entry);
        render();
        form.reset();
        status.textContent = '링크를 추가했습니다. 수정된 LINKS.html을 다운로드해 주세요.';
      });

      downloadButton.addEventListener('click', () => {
        downloadHtml(links);
        status.textContent = '다운로드한 LINKS.html로 GitHub의 기존 파일을 교체해 주세요.';
      });
    }

    render();
  </script>
</body>
</html>

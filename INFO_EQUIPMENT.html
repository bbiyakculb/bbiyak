<script>
const DATA=JSON.parse(document.getElementById('equipment-data').textContent);
const $=id=>document.getElementById(id);
const state={sheet:-1,group:'전체',query:''};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(name,active,fn){const b=document.createElement('button');b.textContent=name;b.classList.toggle('active',active);b.type='button';b.onclick=fn;return b;}
function tabs(){ $('tabs').replaceChildren(button('전체',state.sheet===-1,()=>{state.sheet=-1;state.group='전체';render();}),...DATA.map((s,i)=>button(s.name,state.sheet===i,()=>{state.sheet=i;state.group='전체';render();})));}
function columns(g){return Object.entries(g.headers).sort((a,b)=>+a[0]-+b[0]);}
function isExtra(name){return /합성|조건|딜레이/.test(name);}
function cell(it,j,name){const base=it.base[j]||'',limit=it.limit[j]||'';
 if(isExtra(name))return `<td class="extra">${base?esc(base):'<span class="empty">—</span>'}</td>`;
 return `<td>${base?`<span class="val">${esc(base)}</span>`:'<span class="empty">—</span>'}${limit?`<span class="limit">한계 ${esc(limit)}</span>`:''}</td>`;
}
function matches(it,g,q){if(!q)return true;return [it.name,g.name,...Object.values(it.base),...Object.values(it.limit)].join(' ').toLocaleLowerCase().includes(q);}
function render(){
 const all=state.sheet===-1;
 const sheets=all?DATA:[DATA[state.sheet]];
 tabs();
 const groupOptions=all
   ? DATA.flatMap((sh,si)=>sh.groups.map((g,gi)=>({label:`${sh.name} · ${g.name}`,key:`${si}:${gi}`})))
   : sheets[0].groups.map(g=>({label:g.name,key:g.name}));
 $('chips').replaceChildren(
   button('전체',state.group==='전체',()=>{state.group='전체';render();}),
   ...groupOptions.map(opt=>button(opt.label,state.group===opt.key,()=>{state.group=opt.key;render();}))
 );
 $('search').placeholder=all?'전체 장비명·능력치·조건 검색':'장비명·능력치·조건 검색';
 $('notes').innerHTML=all?'':sheets.flatMap(sh=>sh.notes||[]).map(n=>`<p class="notice">※ ${esc(n)}</p>`).join('');
 let total=0,groupCount=0;const sections=[];const q=state.query.trim().toLocaleLowerCase();
 sheets.forEach((sh,si)=>{
  sh.groups.forEach((g,gi)=>{
   if(state.group!=='전체' && (all ? state.group!==`${si}:${gi}` : state.group!==g.name))return;
   const items=g.items.filter(it=>matches(it,g,q));if(!items.length)return;
   total+=items.length;groupCount++;
   const cols=columns(g);
   const head=`<thead><tr><th class="item">장비명</th>${cols.map(([j,n])=>`<th>${esc(n)}</th>`).join('')}</tr></thead>`;
   const body=`<tbody>${items.map(it=>`<tr><td class="item">${esc(it.name)}</td>${cols.map(([j,n])=>cell(it,j,n)).join('')}</tr>`).join('')}</tbody>`;
   const heading=all?`${sh.name} · ${g.name}`:g.name;
   sections.push(`<section class="section"><h2>${esc(heading)}<small>${items.length}개</small></h2><div class="scroll"><table>${head}${body}</table></div><div class="hscroll" role="scrollbar" aria-label="${esc(heading)} 가로 스크롤" aria-orientation="horizontal" tabindex="0"><div class="hscroll-thumb"></div></div></section>`);
  });
 });
 $('count').textContent=all?`전체 · ${total}개 장비 / ${groupCount}개 분류`:`${sheets[0].name} · ${total}개 장비 / ${sheets[0].groups.length}개 분류`;
 $('content').innerHTML=sections.length?sections.join(''):'<div class="noresults">검색 조건에 맞는 장비가 없습니다.</div>';
 setupScrollbars();
}

function setupScrollbars(){
 document.querySelectorAll('.section').forEach(section=>{
  const scroller=section.querySelector('.scroll');
  const track=section.querySelector('.hscroll');
  const thumb=track.querySelector('.hscroll-thumb');
  const update=()=>{
   const available=Math.max(0,scroller.scrollWidth-scroller.clientWidth);
   const trackWidth=track.clientWidth;
   const thumbWidth=available?Math.max(36,Math.round(trackWidth*scroller.clientWidth/scroller.scrollWidth)):trackWidth;
   thumb.style.width=thumbWidth+'px';
   thumb.style.transform=`translateX(${available?(scroller.scrollLeft/available)*(trackWidth-thumbWidth):0}px)`;
   track.setAttribute('aria-valuemin','0');
   track.setAttribute('aria-valuemax',String(Math.round(available)));
   track.setAttribute('aria-valuenow',String(Math.round(scroller.scrollLeft)));
   track.classList.toggle('no-overflow',!available);
  };
  const moveTo=(clientX,offset)=>{
   const available=Math.max(0,scroller.scrollWidth-scroller.clientWidth);
   const rail=track.getBoundingClientRect();
   const travel=track.clientWidth-thumb.offsetWidth;
   scroller.scrollLeft=travel?Math.max(0,Math.min(1,(clientX-rail.left-offset)/travel))*available:0;
  };
  track.addEventListener('pointerdown',event=>{
   const inThumb=event.target===thumb;
   const offset=inThumb?event.clientX-thumb.getBoundingClientRect().left:thumb.offsetWidth/2;
   moveTo(event.clientX,offset);
   track.setPointerCapture(event.pointerId);
   const onMove=e=>moveTo(e.clientX,offset);
   const onUp=()=>{track.removeEventListener('pointermove',onMove);track.removeEventListener('pointerup',onUp);track.removeEventListener('pointercancel',onUp);};
   track.addEventListener('pointermove',onMove);
   track.addEventListener('pointerup',onUp);
   track.addEventListener('pointercancel',onUp);
  });
  track.addEventListener('keydown',e=>{
   if(e.key==='ArrowRight'){scroller.scrollLeft+=100;e.preventDefault();}
   if(e.key==='ArrowLeft'){scroller.scrollLeft-=100;e.preventDefault();}
   if(e.key==='Home'){scroller.scrollLeft=0;e.preventDefault();}
   if(e.key==='End'){scroller.scrollLeft=scroller.scrollWidth;e.preventDefault();}
  });
  scroller.addEventListener('scroll',update,{passive:true});
  if(typeof ResizeObserver!=='undefined'){const observer=new ResizeObserver(update);observer.observe(scroller);observer.observe(scroller.querySelector('table'));}
  requestAnimationFrame(update);
 });
}

$('search').addEventListener('input',e=>{state.query=e.target.value;render();});render();
</script></body></html>
